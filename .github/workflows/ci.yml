---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + unit tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (biome)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (node:test, runs against dist/)
        run: npm test

      # Advisory: a new advisory in a dependency should be seen, but it should
      # not turn every unrelated pull request red.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  upstream:
    name: upstream fidelity (vendor matches the pinned tag)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Guards the project's central claim: the chat UI is the unmodified upstream
    # bundle. Fails when a vendored file drifts from the pinned tag (or when a
    # local change is not documented in docs/UPSTREAM.md).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compare vendor/upstream with the pinned upstream tag
        run: node scripts/check-upstream.cjs

  smoke:
    name: runtime smoke test (advisory)
    runs-on: windows-latest
    timeout-minutes: 30
    # Boots a real Electron window; kept advisory so a headless-runner hiccup
    # never blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the pi CLI (the app spawns it)
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Build the vendored chat UI
        run: npm run build:renderer

      - name: Build the app
        run: npm run build

      - name: Smoke test (preload allowlist, CSP, openPath guard, sidebar)
        run: npm run smoke

  package:
    name: packaged build contains its runtime dependencies
    runs-on: windows-latest
    timeout-minutes: 30
    # Blocking on purpose, unlike `smoke`: this asserts a deterministic artifact
    # rather than booting a window. Nothing else in CI packaged the app, so a
    # `files` glob that dropped the vendored UI, a bridge extension or the
    # node-pty natives only failed for whoever next launched a real installer.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The vendored chat UI is a build artifact and is not committed.
      - name: Build the vendored chat UI
        run: npm run build:renderer

      - name: Build and package (portable)
        run: npm run build && npm run dist:portable

      - name: Check the packaged app.asar
        run: npm run check:package
