---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint + typecheck + unit tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Without the generated bundle, the tests that build the chat page skip
      # themselves (buildChatHtml returns null) and "# fail 0" means less than
      # it looks: six tests, including the build watermark, were skipped here
      # while passing locally. Build it, so this gate is the real one.
      - name: Build the vendored chat UI
        run: npm run build:renderer

      - name: Lint (biome)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (node:test, runs against dist/)
        run: npm test

      # Advisory: a new advisory in a dependency should be seen, but it should
      # not turn every unrelated pull request red.
      - name: Dependency audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  smoke:
    name: runtime smoke test (advisory)
    runs-on: windows-latest
    timeout-minutes: 30
    # Boots a real Electron window; kept advisory so a headless-runner hiccup
    # never blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the pi CLI (the app spawns it)
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent

      - name: Build the vendored chat UI
        run: npm run build:renderer

      - name: Build the app
        run: npm run build

      - name: Smoke test (preload allowlist, CSP, openPath guard, sidebar)
        run: npm run smoke

  package:
    name: packaged build contains its runtime dependencies
    runs-on: windows-latest
    timeout-minutes: 30
    # Blocking on purpose, unlike `smoke`: this asserts a deterministic artifact
    # rather than booting a window. Nothing else in CI packaged the app, so a
    # `files` glob that dropped the vendored UI, a bridge extension or the
    # node-pty natives only failed for whoever next launched a real installer.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The vendored chat UI is a build artifact and is not committed.
      - name: Build the vendored chat UI
        run: npm run build:renderer

      - name: Build and package (portable)
        run: npm run build && npm run dist:portable

      - name: Check the packaged app.asar
        run: npm run check:package
