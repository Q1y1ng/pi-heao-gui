<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
    Fallback page, shown only when the pi-chat bundle is missing.
    Note the nonce: `default-src 'self'` would block these inline tags,
    which is why the previous version was stuck on "检查中…" forever.
  -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'nonce-pi-standalone'; style-src 'nonce-pi-standalone'"
    />
    <title>Pi Heao GUI</title>
    <style nonce="pi-standalone">
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei",
          sans-serif;
        background: #1e1e1e;
        color: #cccccc;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
      }
      .logo {
        font-size: 48px;
        opacity: 0.6;
      }
      h1 {
        font-size: 20px;
        font-weight: 500;
      }
      p {
        font-size: 13px;
        opacity: 0.6;
        max-width: 420px;
        text-align: center;
        line-height: 1.6;
      }
      .status {
        margin-top: 24px;
        padding: 12px 20px;
        border-radius: 8px;
        background: #2d2d2d;
        font-size: 12px;
        font-family: monospace;
        max-width: 520px;
        word-break: break-all;
      }
      .status.ok {
        border-left: 3px solid #4ec9b0;
      }
      .status.warn {
        border-left: 3px solid #dcdcaa;
      }
      .brand {
        font-size: 9.5px;
        color: #4a4a4a;
        letter-spacing: 0.35px;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div class="logo">π</div>
    <h1>Pi Heao GUI</h1>
    <p>
      未找到 pi-chat 构建产物。请运行 <code>npm run build:renderer</code> 生成
      <code>vendor/upstream/pi-chat/dist/index.html</code> 后重新启动。
    </p>
    <div class="status" id="status">检查中…</div>
    <div class="brand" title="Pi Heao GUI V0.1 — made by HEAOZIE">
      made by HEAOZIE
    </div>
    <script nonce="pi-standalone">
      const status = document.querySelector("#status");
      if (window.pi) {
        status.className = "status ok";
        status.textContent =
          "Preload bridge: OK — window.pi 可用（chat preload 为白名单模式）";
      } else {
        status.className = "status warn";
        status.textContent = "Preload bridge: MISSING — window.pi 未注入";
      }
    </script>
  </body>
</html>
